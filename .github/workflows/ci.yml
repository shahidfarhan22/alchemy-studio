name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (build, vulnerability check, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Build (warnings as errors)
        run: dotnet build --no-restore --configuration Release -p:TreatWarningsAsErrors=true

      - name: Check for vulnerable dependencies
        run: |
          set -e
          output=$(dotnet list package --vulnerable --include-transitive 2>&1)
          echo "$output"
          if echo "$output" | grep -qi "has the following vulnerable packages"; then
            echo "::error::Vulnerable NuGet packages found -- see output above."
            exit 1
          fi

      - name: Test
        run: dotnet test --no-restore --configuration Release --logger "console;verbosity=normal"

  frontend:
    name: Frontend (build, lint, typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `next build` runs a full TypeScript typecheck as part of itself --
      # a standalone `tsc --noEmit` here is redundant AND broken on a fresh
      # checkout: it needs .next/types/ (e.g. the ambient LayoutProps type),
      # which only exists after a build has run at least once. Found this
      # the hard way on the first real CI run -- passed locally (where a
      # build had already run) but failed fresh in Actions.
      - name: Build (includes typecheck)
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5007
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high
